services:
  - type: web
    name: pavibra-suprimentos
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: ADMIN_EMAIL
        value: ayrton.maia@pavibra.com.br
      - key: ADMIN_SETUP_KEY
        generateValue: true
    disk:
      name: pavibra-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
